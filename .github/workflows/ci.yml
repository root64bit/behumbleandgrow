name: Phase 0 Production Foundation CI

on:
  push:
    branches: [ main, phase-0-production-foundation ]
  pull_request:
    branches: [ main, phase-0-production-foundation ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Type Checking
        run: npx tsc --noEmit

      - name: Execute Automated Unit & Integration Tests
        run: npm test

      - name: Build Production Web Bundle
        run: npm run build
